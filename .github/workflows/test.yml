name: Test

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup MoonBit
        uses: hustcer/setup-moonbit@v1
        with:
          version: 0.10.7+bc794d341
          core-version: 0.10.7+bc794d341

      - name: Moon fmt check
        run: moon fmt --check

      - name: Moon info
        run: moon info

      - name: Moon check
        run: moon check --target all --deny-warn

      - name: Moon build
        run: moon build --target all

      - name: Moon test
        run: moon test --target all
