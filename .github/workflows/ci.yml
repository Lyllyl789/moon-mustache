name: MoonBit CI

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  build:
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup MoonBit 0.10.7
        uses: hustcer/setup-moonbit@v1
        with:
          version: 0.10.7+bc794d341
          core-version: 0.10.7+bc794d341

      - name: moon version --all
        run: moon version --all

      - name: moon update
        run: moon update

      - name: moon check
        run: moon check --target all --deny-warn

      - name: moon build
        run: moon build --target all

      - name: moon fmt check
        run: moon fmt --check

      # MoonBit 0.10.7 does not expose --deny-warn for moon info.
      - name: moon info --deny-warn
        run: moon info

      - name: moontest
        run: moon test --target all
