name: MoonBit CI

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  build:
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup MoonBit 0.10.3
        uses: hustcer/setup-moonbit@v1
        with:
          version: 0.10.3+16975d007
          core-version: 0.10.3+16975d007

      - name: moon version --all
        run: moon version --all

      - name: moon update
        run: moon update

      - name: moon check
        run: moon check --target all --deny-warn

      # MoonBit 0.10.3 uses --warn for fmt checks; this is the strict equivalent.
      - name: moon fmt --deny-warn
        run: moon fmt --warn

      # MoonBit 0.10.3 does not expose --deny-warn for moon info.
      - name: moon info --deny-warn
        run: moon info

      - name: moontest
        run: moon test --target all
